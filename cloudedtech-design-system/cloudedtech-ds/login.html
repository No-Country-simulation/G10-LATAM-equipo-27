<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · CloudEdTech</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <style>
    .login-form { margin-top: var(--space-8); display: flex; flex-direction: column; gap: var(--space-5); }
    .login-form__title { font-size: var(--text-xl); font-weight: var(--weight-semibold); color: #fff; }
    .login-form__desc { margin-top: var(--space-1); font-size: var(--text-sm); color: var(--slate-400); }
    .login-form .c-btn--primary:disabled { opacity: 0.6; }
    .login-demo { display: flex; gap: var(--space-2); flex-wrap: wrap; justify-content: center; margin-top: var(--space-4); }
    .login-demo button { padding: 0.2rem 0.6rem; border: 1px solid var(--slate-700); border-radius: var(--radius-full); background: transparent; color: var(--slate-400); font-size: var(--text-xs); cursor: pointer; }
    .login-demo button:hover { border-color: var(--orange-500); color: var(--orange-400); }
  </style>
</head>
<body>
  <main class="l-auth">
    <section class="l-auth__card" aria-labelledby="login-title">
      <div class="c-brand c-brand--stacked">
        <img class="c-brand__logo" src="assets/logo.svg" alt="CloudEdTech">
        <div>
          <h1 class="c-brand__name">Cloud<span>Ed</span>Tech</h1>
          <p class="c-brand__tag">Education &amp; Technology</p>
        </div>
      </div>
      <p class="l-auth__sub">Inteligencia para comunidades digitales</p>

      <form class="login-form" id="login-form" novalidate>
        <div>
          <h2 class="login-form__title" id="login-title">Iniciar sesión</h2>
          <p class="login-form__desc">Ingresa tus credenciales para acceder a la plataforma.</p>
        </div>

        <div class="c-field">
          <label class="c-label c-label--dark" for="user">Usuario</label>
          <input class="c-input c-input--dark" id="user" name="user" autocomplete="username" placeholder="Ingresa tu usuario">
        </div>

        <div class="c-field">
          <label class="sr-only" for="pass">Contraseña</label>
          <div class="c-input-group">
            <input class="c-input c-input--dark" id="pass" name="pass" type="password" autocomplete="current-password" placeholder="Ingresa tu contraseña" style="padding-right:3rem">
            <button type="button" class="c-input-group__action" id="toggle-pass" aria-label="Mostrar contraseña">
              <svg class="icon" viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <p class="c-hint c-hint--error" id="login-error" hidden>Usuario o contraseña incorrectos.</p>
        </div>

        <button class="c-btn c-btn--primary c-btn--lg c-btn--block" id="login-btn" type="submit" disabled>Iniciar sesión</button>
      </form>

      <div class="login-demo" aria-label="Accesos de demostración">
        <button type="button" data-role="admin">Demo · Administrador</button>
        <button type="button" data-role="reviewer">Demo · Revisor</button>
        <button type="button" data-role="community_manager">Demo · Community Manager</button>
      </div>

      <p class="l-auth__foot">Acceso restringido · CloudEdTech</p>
    </section>
  </main>

  <script>
    // Prototipo: no valida contra ningún servidor; solo simula el flujo.
    const form = document.getElementById('login-form');
    const user = document.getElementById('user');
    const pass = document.getElementById('pass');
    const btn = document.getElementById('login-btn');
    const sync = () => { btn.disabled = !(user.value.trim() && pass.value); };
    user.addEventListener('input', sync);
    pass.addEventListener('input', sync);

    document.getElementById('toggle-pass').addEventListener('click', (e) => {
      const show = pass.type === 'password';
      pass.type = show ? 'text' : 'password';
      e.currentTarget.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
      e.currentTarget.innerHTML = show
        ? '<svg class="icon" viewBox="0 0 24 24"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>'
        : '<svg class="icon" viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>';
    });

    const enter = (role) => {
      btn.disabled = true;
      btn.innerHTML = '<svg class="icon spin" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Ingresando…';
      try { sessionStorage.setItem('ce-role', role); } catch (_) {}
      setTimeout(() => { location.href = 'app.html#dashboard'; }, 700);
    };

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (btn.disabled) return;
      enter('admin');
    });
    document.querySelectorAll('[data-role]').forEach((b) => b.addEventListener('click', () => {
      user.value = 'demo.' + b.dataset.role.replace('_', '');
      pass.value = '••••••••';
      enter(b.dataset.role);
    }));
  </script>
</body>
</html>
